<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            padding: 55px;
        }
        .dice_container{
            background-color:antiquewhite;
            height: 400px;
            width: 300px;
            
            position: absolute;
            top: 100px;
            right: 100px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            justify-content: space-evenly;
        }

        .dice{
            background-color: white;
            height: 150px;
            width: 150px;
          display: grid;
          grid-template-columns: repeat(3,1fr);
          grid-template-rows: repeat(2,1fr);
            border-radius: 18px;
            padding: 10px;
            align-items: center;
            justify-items: center;
        }

        #Roll_Dice{
            background-color: aliceblue;
            padding: 15px;
            font-size: 18px;
             border-radius: 18px;
             
        }

        #result{
           
            color: darkred;
          
            font-size: 28px;
            
        }

        .dot{
            background-color: black;
            height: 15px;
            width: 15px;
            border-radius: 50%;
        }
        .container{
            margin-left: 300px;
            height: 600px;
            width: 600px;
            border: 2px solid saddlebrown;
            display: grid;
            grid-template-columns: repeat(2,1fr);
            grid-template-rows: repeat(2,1fr);
            gap: 100px;
        }

        .yellow-square{
            background-color: yellow;
            display: flex;
            justify-content: center;
            align-items: center;
        }

         .green-square{
            background-color: green;
            display: flex;
            justify-content: center;
            align-items: center;
        }

         .blue-square{
            background-color: blue;
            display: flex;
            justify-content: center;
            align-items: center;
        }

         .red-square{
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .white_square{
            background-color: white;
            width: 150px;
            height: 150px;
        }

      .white_square{
            display: grid;
            grid-template-columns: repeat(2,1fr);
              grid-template-rows: repeat(2,1fr);
              justify-items: center;
              align-items: center;
        }

        .yellow_pawns{
            background-color: yellow;
            height: 30px ;
            width:30px ;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

          .green_pawns{
            background-color: green;
            height: 30px ;
            width:30px ;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

         .blue_pawns{
            background-color: blue;
            height: 30px ;
            width:30px ;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

         .red_pawns{
            background-color: red;
            height: 30px ;
            width:30px ;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }
        .pawn_dot{
            height: 10px;
            width: 10px;
            background-color: black;
             border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="yellow-square">
            <div class="white_square">
                <div class="yellow_pawns">
                    <div class="pawn_dot"></div>
                </div>
                <div class="yellow_pawns">
                     <div class="pawn_dot"></div>
                </div>
                <div class="yellow_pawns">
                     <div class="pawn_dot"></div>
                </div>
                <div class="yellow_pawns">
                     <div class="pawn_dot"></div>
                </div>
            </div>
        </div>

        <div class="green-square">
                <div class="white_square">
                     <div class="green_pawns">
                    <div class="pawn_dot"></div>
                </div>
                <div class="green_pawns">
                     <div class="pawn_dot"></div>
                </div>
                <div class="green_pawns">
                     <div class="pawn_dot"></div>
                </div>
                <div class="green_pawns">
                     <div class="pawn_dot"></div>
                </div>
                </div>
        </div>

        <div class="blue-square">
                <div class="white_square">
                         <div class="blue_pawns">
                    <div class="pawn_dot"></div>
                </div>
                <div class="blue_pawns">
                     <div class="pawn_dot"></div>
                </div>
                <div class="blue_pawns">
                     <div class="pawn_dot"></div>
                </div>
                <div class="blue_pawns">
                     <div class="pawn_dot"></div>
                </div>
                </div>
        </div>

        <div class="red-square">
                <div class="white_square">
                            <div class="red_pawns">
                    <div class="pawn_dot"></div>
                </div>
                <div class="red_pawns">
                     <div class="pawn_dot"></div>
                </div>
                <div class="red_pawns">
                     <div class="pawn_dot"></div>
                </div>
                <div class="red_pawns">
                     <div class="pawn_dot"></div>
                </div>
                </div>
        </div>
    </div>
    <div class="dice_container">
        <div class="dice"></div>
        <button id="Roll_Dice">Roll Dice</button>
        <div id="result">Result:</div>
    </div>
   
    <script>
        const diceVar=document.querySelector(".dice");
        const RolldiceVar=document.querySelector("#Roll_Dice");

        let resultVar=document.querySelector("#result"); result

        function getRandomInt(min, max) {
            
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
        RolldiceVar.addEventListener("click",()=>{
            
            const number= getRandomInt(1, 6);
           
            resultVar.innerHTML=`Result: ${number}`;
          
           
            console.log(number);
            for(let i=1;i<=number;i++){
                if(i===1){
                    diceVar.innerHTML=`<div class="dot"></div>`;
                }
                   else if(i===2){
                    diceVar.innerHTML=`<div class="dot"></div> <div class="dot"></div>`;
                }
                else if(i===3){
                    diceVar.innerHTML=`<div class="dot"></div> <div class="dot"></div> <div class="dot"></div>`;
                }
                 else if(i===4){
                    diceVar.innerHTML=`<div class="dot"></div> <div class="dot"></div> <div class="dot"></div> <div class="dot"></div>`;
                }
                 else if(i===5){
                    diceVar.innerHTML=`<div class="dot"></div> <div class="dot"></div> <div class="dot"></div> <div class="dot"></div> <div class="dot"></div>`;
                }
                  else if(i===6){
                    diceVar.innerHTML=`<div class="dot"></div> <div class="dot"></div> <div class="dot"></div> <div class="dot"></div> <div class="dot"></div> <div class="dot"></div>`;
                }
            }
        })

       
    </script>
</body>
</html>
